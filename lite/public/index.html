<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议助手</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e222e; --border: #2a2f3d;
    --text: #e6e9f0; --muted: #9aa1b2; --accent: #4b6bfb;
    --ok: #2ea87c; --warn: #d9a441; --err: #e5484d; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  .app { max-width: 860px; margin: 0 auto; padding: 16px; }
  a { color: var(--accent); text-decoration: none; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.big { padding: 16px 24px; font-size: 18px; border-radius: 12px; width: 100%; }
  input, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: inherit; width: 100%; }
  textarea { resize: vertical; min-height: 60px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 3px; margin-bottom: 12px; width: fit-content; }
  .tabs button { border: none; background: transparent; padding: 6px 16px; border-radius: 6px; }
  .tabs button.active { background: var(--accent); color: #fff; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.err { color: var(--err); border-color: var(--err); }
  .badge.rec { color: #fff; background: var(--err); border-color: var(--err); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .muted { color: var(--muted); font-size: 12px; }
  .q-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .q-card h4 { margin: 0 0 6px; font-size: 14px; }
  .reply { border-left: 3px solid var(--accent); padding: 6px 10px; margin: 6px 0; }
  .reply .tag { font-size: 11px; color: var(--muted); }
  .reply p { margin: 4px 0; }
  .t-entry { padding: 4px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 10px; }
  .t-entry time { color: var(--muted); font-size: 12px; flex: none; padding-top: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .hist-item { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px dashed var(--border); cursor: pointer; border-radius: 6px; }
  .hist-item:hover { background: var(--panel2); }
  .grow { flex: 1; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 18px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; max-width: 640px; width: 92%; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog .inner { padding: 18px 20px; }
  dialog h3 { margin: 0 0 8px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
